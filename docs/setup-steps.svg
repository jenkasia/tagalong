<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Setup on each computer: 1 pair, 2 download, 3 turn on F-keys, 4 run the setup for your system</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="139" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <g fill="#ffffff" stroke="#d0d7de">
    <rect x="18" y="20" width="190" height="100" rx="10"/>
    <rect x="243" y="20" width="190" height="100" rx="10"/>
    <rect x="468" y="20" width="190" height="100" rx="10"/>
    <rect x="693" y="20" width="190" height="100" rx="10" stroke="#2da44e" stroke-width="1.5"/>
  </g>
  <g stroke="#57606a" stroke-width="2" marker-end="url(#g)">
    <line x1="212" y1="70" x2="238" y2="70"/>
    <line x1="437" y1="70" x2="463" y2="70"/>
    <line x1="662" y1="70" x2="688" y2="70"/>
  </g>

  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="40" cy="44" r="12" fill="#0969da"/><text x="40" y="48.5">1</text>
    <circle cx="265" cy="44" r="12" fill="#0969da"/><text x="265" y="48.5">2</text>
    <circle cx="490" cy="44" r="12" fill="#0969da"/><text x="490" y="48.5">3</text>
    <circle cx="715" cy="44" r="12" fill="#2da44e"/><text x="715" y="48.5">4</text>
  </g>
  <g font-size="15" font-weight="600" fill="#1f2328">
    <text x="60" y="49">Pair</text>
    <text x="285" y="49">Download</text>
    <text x="510" y="49">F-keys on</text>
    <text x="735" y="49">Run setup</text>
  </g>
  <g font-size="12" fill="#57606a">
    <text x="30" y="80">Keyboard and mouse on</text>
    <text x="30" y="97">the same channel number</text>
    <text x="255" y="80">git clone, or</text>
    <text x="255" y="97">Code → Download ZIP</text>
    <text x="480" y="80">Fn+Esc, so the top row</text>
    <text x="480" y="97">sends F1, F2, F3</text>
    <text x="705" y="80">From mac/, windows/</text>
    <text x="705" y="97">or linux/. It asks for</text>
    <text x="705" y="112">the channel.</text>
  </g>
</svg>
