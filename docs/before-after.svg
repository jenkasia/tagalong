<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Before: the Easy-Switch key moves only the keyboard and the mouse stays. After: both move.</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <!-- small icons -->
    <g id="monitor">
      <rect x="0" y="0" width="90" height="56" rx="5" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
      <rect x="37" y="56" width="16" height="8" fill="#d0d7de"/>
      <rect x="27" y="64" width="36" height="3" rx="1.5" fill="#8c959f"/>
    </g>
    <g id="kb">
      <rect x="0" y="0" width="56" height="22" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
      <line x1="7" y1="8" x2="49" y2="8" stroke="#8c959f" stroke-width="3" stroke-dasharray="5 2"/>
      <line x1="7" y1="15" x2="49" y2="15" stroke="#8c959f" stroke-width="3" stroke-dasharray="5 2"/>
    </g>
    <g id="mouse">
      <rect x="0" y="0" width="18" height="28" rx="9" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
      <line x1="9" y1="0" x2="9" y2="10" stroke="#57606a" stroke-width="1.2"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="234" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Easy-Switch moves only the keyboard. This moves both.</text>

  <!-- LEFT: Easy-Switch alone -->
  <rect x="18" y="50" width="422" height="165" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="38" cy="72" r="10" fill="#cf222e"/>
  <path d="M34,68 L42,76 M42,68 L34,76" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="77" font-size="14" font-weight="600" fill="#1f2328">Easy-Switch key alone</text>
  <use href="#monitor" x="38" y="110"/>
  <use href="#monitor" x="330" y="110"/>
  <use href="#kb" x="201" y="97"/>
  <line x1="138" y1="128" x2="320" y2="128" stroke="#57606a" stroke-width="2" marker-end="url(#g)"/>
  <use href="#mouse" x="140" y="146"/>
  <text x="166" y="166" font-size="12" font-weight="600" fill="#cf222e">mouse stays on A</text>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="83" y="196">Computer A</text>
    <text x="375" y="196">Computer B</text>
  </g>

  <!-- RIGHT: with this tool -->
  <rect x="460" y="50" width="422" height="165" rx="10" fill="#ffffff" stroke="#2da44e" stroke-width="1.5"/>
  <circle cx="480" cy="72" r="10" fill="#2da44e"/>
  <path d="M475.5,72 L478.5,75 L484.5,69" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="498" y="77" font-size="14" font-weight="600" fill="#1f2328">With logitechmouseswitch</text>
  <use href="#monitor" x="480" y="110"/>
  <use href="#monitor" x="772" y="110"/>
  <use href="#kb" x="643" y="97"/>
  <line x1="580" y1="128" x2="762" y2="128" stroke="#1a7f37" stroke-width="2" marker-end="url(#ok)"/>
  <use href="#mouse" x="662" y="146"/>
  <line x1="580" y1="182" x2="762" y2="182" stroke="#1a7f37" stroke-width="2" marker-end="url(#ok)"/>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="525" y="196">Computer A</text>
    <text x="817" y="196">Computer B</text>
  </g>
</svg>
