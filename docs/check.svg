<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" width="640" height="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Output of switch/check.py: both devices can switch, 3 channels each, on channel 1 now</title>
  <rect x="0" y="0" width="640" height="176" rx="10" fill="#0d1117"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="38" cy="18" r="6" fill="#febc2e"/><circle cx="56" cy="18" r="6" fill="#28c840"/>
  <text x="320" y="22" text-anchor="middle" font-size="12" fill="#8b949e">Terminal</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">
    <text x="16" y="56"><tspan fill="#7ee787">$</tspan> .venv/bin/python switch/check.py</text>
    <text x="16" y="82"><tspan fill="#79c0ff">MX Master 3</tspan> (mouse): <tspan fill="#7ee787">can switch</tspan>. 3 channels, on channel 1 now.</text>
    <text x="16" y="104"><tspan fill="#79c0ff">MX Keys M Mac</tspan> (keyboard or other): <tspan fill="#7ee787">can switch</tspan>. 3 channels, on channel 1 now.</text>
    <text x="16" y="138" fill="#8b949e">The channel shown is this computer's channel: enter it when the setup asks.</text>
  </g>
</svg>
