<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" width="900" height="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How it works: press F2, the computer that has the devices sends the mouse and then the keyboard to channel 2</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- solid card so it reads on light and dark pages -->
  <rect x="0.5" y="0.5" width="899" height="324" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="42" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">Press F2: the keyboard and the mouse both move to channel 2</text>

  <!-- step cards -->
  <g fill="#ffffff" stroke="#d0d7de">
    <rect x="18" y="70" width="190" height="200" rx="10"/>
    <rect x="243" y="70" width="190" height="200" rx="10"/>
    <rect x="468" y="70" width="190" height="200" rx="10"/>
    <rect x="693" y="70" width="190" height="200" rx="10" stroke="#2da44e" stroke-width="1.5"/>
  </g>

  <!-- arrows between cards -->
  <g stroke="#57606a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="212" y1="170" x2="238" y2="170"/>
    <line x1="437" y1="170" x2="463" y2="170"/>
    <line x1="662" y1="170" x2="688" y2="170"/>
  </g>

  <!-- number badges and titles -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="40" cy="96" r="12" fill="#0969da"/><text x="40" y="100.5">1</text>
    <circle cx="265" cy="96" r="12" fill="#0969da"/><text x="265" y="100.5">2</text>
    <circle cx="490" cy="96" r="12" fill="#0969da"/><text x="490" y="100.5">3</text>
    <circle cx="715" cy="96" r="12" fill="#2da44e"/><text x="715" y="100.5">4</text>
  </g>
  <g font-size="14" font-weight="600" fill="#1f2328">
    <text x="60" y="101">You press F2</text>
    <text x="285" y="101">A hears it</text>
    <text x="510" y="101">A sends both</text>
    <text x="735" y="101">Both reach B</text>
  </g>

  <!-- 1: keyboard with F2 pressed -->
  <line x1="129" y1="118" x2="129" y2="141" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="48" y="144" width="130" height="62" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <g font-size="9" text-anchor="middle" font-weight="600">
    <rect x="56" y="151" width="26" height="14" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="69" y="161" fill="#57606a">esc</text>
    <rect x="86" y="151" width="26" height="14" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="99" y="161" fill="#57606a">F1</text>
    <rect x="116" y="151" width="26" height="14" rx="3" fill="#0969da" stroke="#0969da"/><text x="129" y="161" fill="#ffffff">F2</text>
    <rect x="146" y="151" width="26" height="14" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="159" y="161" fill="#57606a">F3</text>
  </g>
  <g fill="#ffffff" stroke="#8c959f">
    <rect x="56" y="171" width="16" height="12" rx="2"/><rect x="75" y="171" width="16" height="12" rx="2"/><rect x="94" y="171" width="16" height="12" rx="2"/>
    <rect x="113" y="171" width="16" height="12" rx="2"/><rect x="132" y="171" width="16" height="12" rx="2"/><rect x="151" y="171" width="21" height="12" rx="2"/>
    <rect x="56" y="187" width="21" height="12" rx="2"/><rect x="80" y="187" width="16" height="12" rx="2"/><rect x="99" y="187" width="16" height="12" rx="2"/>
    <rect x="118" y="187" width="16" height="12" rx="2"/><rect x="137" y="187" width="16" height="12" rx="2"/><rect x="156" y="187" width="16" height="12" rx="2"/>
  </g>

  <!-- 2: computer A with the listener -->
  <rect x="288" y="128" width="100" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <rect x="328" y="192" width="20" height="10" fill="#d0d7de"/>
  <rect x="313" y="202" width="50" height="4" rx="2" fill="#8c959f"/>
  <text x="338" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Computer A</text>
  <rect x="300" y="162" width="76" height="18" rx="9" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="338" y="175" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#0969da">listener.py</text>

  <!-- 3: mouse first, then keyboard -->
  <rect x="500" y="137" width="40" height="62" rx="20" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <line x1="520" y1="137" x2="520" y2="160" stroke="#57606a" stroke-width="1.5"/>
  <rect x="517" y="145" width="6" height="10" rx="3" fill="#8c959f"/>
  <rect x="558" y="150" width="72" height="38" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#8c959f">
    <rect x="565" y="157" width="12" height="9" rx="2"/><rect x="580" y="157" width="12" height="9" rx="2"/><rect x="595" y="157" width="12" height="9" rx="2"/><rect x="610" y="157" width="13" height="9" rx="2"/>
    <rect x="565" y="171" width="58" height="9" rx="2"/>
  </g>
  <g font-size="11" font-weight="600" fill="#0969da" text-anchor="middle">
    <text x="520" y="216">1st</text>
    <text x="594" y="216">2nd</text>
  </g>

  <!-- 4: computer B with both devices -->
  <rect x="738" y="128" width="100" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <rect x="778" y="192" width="20" height="10" fill="#d0d7de"/>
  <rect x="763" y="202" width="50" height="4" rx="2" fill="#8c959f"/>
  <text x="788" y="153" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Computer B</text>
  <circle cx="788" cy="171" r="10" fill="#2da44e"/>
  <path d="M783,171 L786.5,174.5 L793,167.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- captions -->
  <g font-size="12" fill="#57606a" text-anchor="middle">
    <text x="113" y="240">Easy-Switch key 2, sent</text>
    <text x="113" y="256">as F2 (fn lock on)</text>
    <text x="338" y="240">Computer A, channel 1,</text>
    <text x="338" y="256">has the devices now</text>
    <text x="563" y="240">mouse first, then the</text>
    <text x="563" y="256">keyboard: go to channel 2</text>
    <text x="788" y="240">Computer B, channel 2,</text>
    <text x="788" y="256">about a second later</text>
  </g>

  <text x="450" y="302" text-anchor="middle" font-size="12.5" fill="#57606a">Without it, the Easy-Switch key moves only the keyboard, and the mouse stays on computer A.</text>
</svg>
