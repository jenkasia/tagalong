<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Each computer has one channel number, the same on the keyboard and the mouse. F1, F2 and F3 go to channels 1, 2 and 3.</title>
  <defs>
    <g id="monitor">
      <rect x="0" y="0" width="150" height="78" rx="6" fill="#f6f8fa" stroke-width="2"/>
      <rect x="65" y="78" width="20" height="10" fill="#d0d7de"/>
      <rect x="50" y="88" width="50" height="4" rx="2" fill="#8c959f"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2328">One channel number per computer, the same on the keyboard and the mouse</text>

  <!-- keyboard -->
  <rect x="300" y="60" width="190" height="76" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="318" y="70" width="44" height="20" rx="4" fill="#0969da"/><text x="340" y="84">F1</text>
    <rect x="373" y="70" width="44" height="20" rx="4" fill="#8250df"/><text x="395" y="84">F2</text>
    <rect x="428" y="70" width="44" height="20" rx="4" fill="#bc4c00"/><text x="450" y="84">F3</text>
  </g>
  <g fill="#ffffff" stroke="#8c959f">
    <rect x="318" y="98" width="24" height="12" rx="2"/><rect x="346" y="98" width="24" height="12" rx="2"/><rect x="374" y="98" width="24" height="12" rx="2"/><rect x="402" y="98" width="24" height="12" rx="2"/><rect x="430" y="98" width="24" height="12" rx="2"/><rect x="458" y="98" width="14" height="12" rx="2"/>
    <rect x="318" y="115" width="154" height="12" rx="2"/>
  </g>

  <!-- mouse with its three channel lights -->
  <rect x="535" y="58" width="46" height="74" rx="23" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <line x1="558" y1="58" x2="558" y2="84" stroke="#57606a" stroke-width="1.5"/>
  <rect x="555" y="66" width="6" height="11" rx="3" fill="#8c959f"/>
  <circle cx="546" cy="146" r="5" fill="#0969da"/>
  <circle cx="558" cy="146" r="5" fill="#8250df"/>
  <circle cx="570" cy="146" r="5" fill="#bc4c00"/>
  <text x="590" y="150" font-size="11" fill="#57606a">channel lights 1 2 3</text>

  <!-- lines from keys to computers -->
  <g stroke-width="2" stroke-dasharray="5 4" fill="none">
    <path d="M340,136 C340,170 170,165 170,196" stroke="#0969da"/>
    <path d="M395,136 L450,196" stroke="#8250df"/>
    <path d="M450,136 C450,170 730,165 730,196" stroke="#bc4c00"/>
  </g>

  <!-- computers -->
  <use href="#monitor" x="95" y="198" stroke="#0969da"/>
  <use href="#monitor" x="375" y="198" stroke="#8250df"/>
  <use href="#monitor" x="655" y="198" stroke="#bc4c00"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="170" y="223" fill="#0969da">Channel 1</text>
    <text x="450" y="223" fill="#8250df">Channel 2</text>
    <text x="730" y="223" fill="#bc4c00">Channel 3</text>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="170" y="240">for example a Mac</text>
    <text x="450" y="240">for example Windows</text>
    <text x="730" y="240">for example Linux</text>
  </g>
  <g font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <rect x="120" y="248" width="100" height="18" rx="9" fill="#ddf4ff" stroke="#54aeff"/><text x="170" y="261" fill="#0969da">--channel 1</text>
    <rect x="400" y="248" width="100" height="18" rx="9" fill="#fbefff" stroke="#c297ff"/><text x="450" y="261" fill="#8250df">--channel 2</text>
    <rect x="680" y="248" width="100" height="18" rx="9" fill="#fff1e5" stroke="#fb8f44"/><text x="730" y="261" fill="#bc4c00">--channel 3</text>
  </g>

  <text x="450" y="316" text-anchor="middle" font-size="12.5" fill="#57606a">Every computer runs the script with its own channel number. Two computers are enough; three is the most.</text>
</svg>
