<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Demo: pressing F2 on computer A sends the mouse, then the keyboard, to computer B. The terminal shows the real log.</title>
  <style>
    .l3 { animation: l3 8s infinite; } .l4 { animation: l4 8s infinite; }
    .l5 { animation: l5 8s infinite; } .l6 { animation: l6 8s infinite; }
    .key { animation: key 8s infinite; }
    .mouse { animation: mouse 8s infinite; }
    .kb { animation: kb 8s infinite; }
    .check { animation: check 8s infinite; }
    @keyframes l3 { 0%, 14% { opacity: 0 } 15%, 92% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l4 { 0%, 26% { opacity: 0 } 27%, 92% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l5 { 0%, 38% { opacity: 0 } 39%, 92% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes l6 { 0%, 49% { opacity: 0 } 50%, 92% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @keyframes key { 0%, 10% { opacity: 0 } 12%, 20% { opacity: 1 } 24%, 100% { opacity: 0 } }
    @keyframes mouse {
      0%, 26% { transform: translate(0, 0); opacity: 1 }
      36%, 92% { transform: translate(216px, 0); opacity: 1 }
      95% { transform: translate(216px, 0); opacity: 0 }
      96% { transform: translate(0, 0); opacity: 0 }
      100% { transform: translate(0, 0); opacity: 1 }
    }
    @keyframes kb {
      0%, 38% { transform: translate(0, 0); opacity: 1 }
      48%, 92% { transform: translate(216px, 0); opacity: 1 }
      95% { transform: translate(216px, 0); opacity: 0 }
      96% { transform: translate(0, 0); opacity: 0 }
      100% { transform: translate(0, 0); opacity: 1 }
    }
    @keyframes check { 0%, 49% { opacity: 0 } 52%, 92% { opacity: 1 } 95%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .l3, .l4, .l5, .l6, .key, .mouse, .kb, .check { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- terminal with the real log -->
  <rect x="18" y="18" width="500" height="284" rx="10" fill="#0d1117"/>
  <circle cx="38" cy="36" r="6" fill="#ff5f57"/><circle cx="56" cy="36" r="6" fill="#febc2e"/><circle cx="74" cy="36" r="6" fill="#28c840"/>
  <text x="268" y="40" text-anchor="middle" font-size="12" fill="#8b949e">Computer A · channel 1</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3">
    <text x="34" y="74"><tspan fill="#7ee787">$</tspan> .venv/bin/python switch/listener.py --channel 1</text>
    <text x="34" y="100"><tspan fill="#8b949e">18:56:21</tspan> keyboard + mouse switch, this computer is channel 1</text>
    <text x="34" y="122"><tspan fill="#8b949e">18:56:23</tspan> MX Keys M Mac is here, listening for F1/F2/F3</text>
    <text x="34" y="144" class="l3"><tspan fill="#8b949e">18:56:39</tspan> <tspan fill="#ffa657">key 2</tspan>: switching to channel 2</text>
    <text x="34" y="166" class="l4"><tspan fill="#8b949e">18:56:40</tspan>&#160;&#160;&#160;sent <tspan fill="#79c0ff">MX Master 3</tspan> to channel 2</text>
    <text x="34" y="188" class="l5"><tspan fill="#8b949e">18:56:41</tspan>&#160;&#160;&#160;sent <tspan fill="#79c0ff">MX Keys M Mac</tspan> to channel 2</text>
    <text x="34" y="210" class="l6"><tspan fill="#8b949e">18:56:41</tspan> keyboard left</text>
  </g>
  <text x="34" y="288" font-size="11" font-style="italic" fill="#6e7681">Real log from a switch. The animation on the right is an illustration.</text>

  <!-- what happens -->
  <rect x="536" y="18" width="346" height="284" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- F2 keycap that lights up -->
  <rect x="689" y="40" width="40" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
  <rect class="key" x="689" y="40" width="40" height="28" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1.5"/>
  <text x="709" y="59" text-anchor="middle" font-size="13" font-weight="700" fill="#57606a">F2</text>
  <text class="key" x="709" y="59" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">F2</text>

  <!-- computers -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="1.5">
    <rect x="556" y="100" width="90" height="56" rx="5"/>
    <rect x="772" y="100" width="90" height="56" rx="5"/>
  </g>
  <g fill="#d0d7de"><rect x="593" y="156" width="16" height="8"/><rect x="809" y="156" width="16" height="8"/></g>
  <g fill="#8c959f"><rect x="583" y="164" width="36" height="3" rx="1.5"/><rect x="799" y="164" width="36" height="3" rx="1.5"/></g>
  <g font-size="24" font-weight="700" fill="#8c959f" text-anchor="middle">
    <text x="601" y="137">A</text><text x="817" y="137">B</text>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="601" y="186">channel 1</text><text x="817" y="186">channel 2</text>
  </g>
  <g class="check">
    <circle cx="858" cy="102" r="11" fill="#2da44e"/>
    <path d="M852.5,102 L856.5,106 L863.5,98.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- devices, starting under A -->
  <g class="kb">
    <rect x="566" y="216" width="56" height="22" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <line x1="573" y1="224" x2="615" y2="224" stroke="#8c959f" stroke-width="3" stroke-dasharray="5 2"/>
    <line x1="573" y1="231" x2="615" y2="231" stroke="#8c959f" stroke-width="3" stroke-dasharray="5 2"/>
  </g>
  <g class="mouse">
    <rect x="630" y="212" width="18" height="28" rx="9" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <line x1="639" y1="212" x2="639" y2="222" stroke="#57606a" stroke-width="1.2"/>
  </g>

  <text x="709" y="282" text-anchor="middle" font-size="12" fill="#57606a">Press F2: the mouse goes first, then the keyboard</text>
</svg>
