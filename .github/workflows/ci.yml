name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every Python file
        run: python -m compileall -q switch dev
      - name: Install hidapi and load the switch
        if: runner.os != 'Linux'
        run: |
          python -m pip install -r switch/requirements.txt
          python switch/listener.py --help
      - name: Check the shell scripts
        if: runner.os != 'Windows'
        run: |
          bash -n mac/setup.sh
          bash -n linux/setup.sh
